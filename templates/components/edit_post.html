<div id="edit-description-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="edit-post-title">
  <div class="modal-content">
    <h2 id="edit-post-title">Edit your post</h2>
    <form id="edit-description-form">
      {% csrf_token %}<input type="hidden" name="post_id">
      <label class="sr-only" for="edit-description">Post content</label>
      <textarea name="content" id="edit-description" placeholder="Update your post..." rows="6"></textarea>
      <div class="modal-actions"><button type="submit" class="btn btn-primary">Save changes</button><button type="button" id="close-edit-description" class="btn btn-secondary">Cancel</button></div>
    </form>
  </div>
</div>
